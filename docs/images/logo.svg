<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" role="img" aria-label="OryxOS">
  <defs>
    <linearGradient id="oryxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A1F"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>

  <!-- Icon: ring with two elegant oryx horns (bezier curves, not straight lines) -->
  <g transform="translate(8,8)">
    <!-- Left horn: rises from ring top-left, curves slightly outward then up to a point -->
    <path d="M 38 44 C 28 24, 22 10, 30 -2 C 36 12, 42 26, 48 40 Z"
          fill="url(#oryxGrad)"/>
    <!-- Right horn: mirror of left -->
    <path d="M 74 44 C 84 24, 90 10, 82 -2 C 76 12, 70 26, 64 40 Z"
          fill="url(#oryxGrad)"/>
    <!-- Ring body -->
    <circle cx="56" cy="60" r="34" fill="none" stroke="url(#oryxGrad)" stroke-width="8"/>
    <!-- Inner core dot -->
    <circle cx="56" cy="60" r="6" fill="url(#oryxGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="86"
        font-family="'Segoe UI', 'Helvetica Neue', 'PingFang SC', Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1.5"
        fill="url(#oryxGrad)"
        text-rendering="geometricPrecision">Oryx<tspan font-weight="300" fill="#3a3a3a">OS</tspan></text>
</svg>
