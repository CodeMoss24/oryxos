<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E8450A"/>
    </linearGradient>
    <linearGradient id="dimOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8450A" stop-opacity="0.1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B2B"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1040" height="780" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="40" x2="1040" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="1040" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1040" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1040" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1040" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1040" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="280" x2="1040" y2="280" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1040" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1040" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1040" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="440" x2="1040" y2="440" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1040" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="520" x2="1040" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="560" x2="1040" y2="560" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1040" y2="600" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="640" x2="1040" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="680" x2="1040" y2="680" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="720" x2="1040" y2="720" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="760" x2="1040" y2="760" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="520" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">OryxOS Architecture</text>
  <text x="520" y="56" text-anchor="middle" font-size="12" fill="#666666">三触发源 → AgentService → ReAct 引擎 → 五大能力 → 基础层</text>

  <!-- Decorative line -->
  <line x1="420" y1="64" x2="620" y2="64" stroke="url(#orangeGrad)" stroke-width="1.5"/>

  <!-- ======== Layer 1: Triggers ======== -->
  <text x="60" y="92" font-size="10" font-weight="700" fill="#FF8C42" letter-spacing="1.5" text-transform="uppercase">TRIGGERS · 接入层</text>

  <!-- CLI -->
  <rect x="60" y="102" width="280" height="56" rx="6" fill="#111111" stroke="#FF6B2B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="200" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#FF8C42">CLI Channel</text>
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#777">oryxos chat · 人推 (human-triggered)</text>

  <!-- Web Service -->
  <rect x="380" y="102" width="280" height="56" rx="6" fill="#111111" stroke="#FF6B2B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="520" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#FF8C42">Web Service</text>
  <text x="520" y="146" text-anchor="middle" font-size="11" fill="#777">REST API (10 endpoints) · 人推</text>

  <!-- AgentScheduler -->
  <rect x="700" y="102" width="280" height="56" rx="6" fill="#111111" stroke="#FF6B2B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="840" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#FF8C42">AgentScheduler</text>
  <text x="840" y="146" text-anchor="middle" font-size="11" fill="#777">cron 定时 · 钟推 (clock-driven)</text>

  <!-- Down arrows -->
  <line x1="200" y1="158" x2="200" y2="190" stroke="#FF6B2B" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="520" y1="158" x2="520" y2="190" stroke="#FF6B2B" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="840" y1="158" x2="840" y2="190" stroke="#FF6B2B" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ======== Layer 2: AgentService ======== -->
  <text x="60" y="185" font-size="10" font-weight="700" fill="#FF8C42" letter-spacing="1.5">ENTRY · 统一入口</text>

  <rect x="100" y="195" width="840" height="52" rx="8" fill="#1a1008" stroke="#FF6B2B" stroke-width="1.5" filter="url(#glow)"/>
  <text x="520" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#FF8C42">AgentService</text>
  <text x="520" y="236" text-anchor="middle" font-size="11" fill="#888">process(Session, msg) · ProfileContext (ThreadLocal) · 持久化 Session</text>

  <!-- Down arrow -->
  <line x1="520" y1="247" x2="520" y2="278" stroke="#FF6B2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ======== Layer 3: Engine ======== -->
  <text x="60" y="274" font-size="10" font-weight="700" fill="#FF8C42" letter-spacing="1.5">ENGINE · 引擎层</text>

  <!-- PromptBuilder -->
  <rect x="60" y="284" width="240" height="72" rx="6" fill="#111111" stroke="#333" stroke-width="1"/>
  <text x="180" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#ccc">PromptBuilder</text>
  <text x="180" y="326" text-anchor="middle" font-size="10" fill="#666">system + Bootstrap + Memory</text>
  <text x="180" y="342" text-anchor="middle" font-size="10" fill="#666">+ 对话历史 + Tool 列表</text>

  <!-- ReActLoop (center, highlighted) -->
  <rect x="370" y="284" width="300" height="72" rx="8" fill="#1a0e04" stroke="#FF6B2B" stroke-width="2" filter="url(#glow)"/>
  <text x="520" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#FF8C42">ReActLoop</text>
  <text x="520" y="326" text-anchor="middle" font-size="11" fill="#FF6B2B" opacity="0.8">Reason + Act · 自实现 · 约数十行 Java</text>
  <text x="520" y="342" text-anchor="middle" font-size="10" fill="#888">MAX_ITER = 10 · 禁用 Spring AI 自动 Tool 执行</text>

  <!-- ToolExecutor -->
  <rect x="740" y="284" width="240" height="72" rx="6" fill="#111111" stroke="#333" stroke-width="1"/>
  <text x="860" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#ccc">ToolExecutor</text>
  <text x="860" y="326" text-anchor="middle" font-size="10" fill="#666">Sandbox 检查 + 执行</text>
  <text x="860" y="342" text-anchor="middle" font-size="10" fill="#666">写入 tool_invocations</text>

  <!-- Horizontal arrows in engine layer -->
  <line x1="300" y1="320" x2="368" y2="320" stroke="#555" stroke-width="1" marker-end="url(#arrowDim)"/>
  <line x1="672" y1="320" x2="738" y2="320" stroke="#555" stroke-width="1" marker-end="url(#arrowDim)"/>

  <!-- Down branches from ReActLoop to capabilities -->
  <line x1="520" y1="356" x2="520" y2="388" stroke="#FF6B2B" stroke-width="1.2"/>
  <line x1="180" y1="388" x2="860" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="180" y1="388" x2="180" y2="414" stroke="#FF6B2B" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="520" y1="388" x2="520" y2="414" stroke="#FF6B2B" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="860" y1="388" x2="860" y2="414" stroke="#FF6B2B" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ======== Layer 4: Capabilities ======== -->
  <text x="60" y="410" font-size="10" font-weight="700" fill="#FF8C42" letter-spacing="1.5">CAPABILITIES · 能力层</text>

  <!-- Provider -->
  <rect x="60" y="420" width="280" height="110" rx="8" fill="#0d1114" stroke="#1a3a2a" stroke-width="1"/>
  <rect x="60" y="420" width="280" height="26" rx="8" fill="#0d1a10"/>
  <rect x="60" y="438" width="280" height="8" fill="#0d1a10"/>
  <text x="200" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Provider · 能力一</text>
  <text x="72" y="464" font-size="10" fill="#888">Spring AI Alibaba</text>
  <text x="72" y="480" font-size="10" fill="#888">DeepSeek · 通义 · Kimi · 智谱</text>
  <text x="72" y="496" font-size="10" fill="#888">混元 · 豆包 · OpenAI · …</text>
  <text x="72" y="518" font-size="9" fill="#555">name → ChatModel 显式映射</text>

  <!-- Memory -->
  <rect x="380" y="420" width="280" height="110" rx="8" fill="#0d1114" stroke="#1a3a2a" stroke-width="1"/>
  <rect x="380" y="420" width="280" height="26" rx="8" fill="#0d1a10"/>
  <rect x="380" y="438" width="280" height="8" fill="#0d1a10"/>
  <text x="520" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Memory · 能力二</text>
  <text x="392" y="464" font-size="10" fill="#888">MemoryService 统一门面</text>
  <text x="392" y="480" font-size="10" fill="#888">Session 记忆 + MEMORY.md</text>
  <text x="392" y="496" font-size="10" fill="#888">核心区 (全量注入) / 归档区</text>
  <text x="392" y="518" font-size="9" fill="#555">Markdown / SQLite / Mem0 三档</text>

  <!-- Tool -->
  <rect x="700" y="420" width="280" height="110" rx="8" fill="#0d1114" stroke="#1a3a2a" stroke-width="1"/>
  <rect x="700" y="420" width="280" height="26" rx="8" fill="#0d1a10"/>
  <rect x="700" y="438" width="280" height="8" fill="#0d1a10"/>
  <text x="840" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Tool · 能力三</text>
  <text x="712" y="464" font-size="10" fill="#888">9 内置 Tool + Plugin 三档</text>
  <text x="712" y="480" font-size="10" fill="#888">MCP Client + ToolRegistry</text>
  <text x="712" y="496" font-size="10" fill="#888">Sandbox + NotifyChannelAdapter</text>
  <text x="712" y="518" font-size="9" fill="#555">OryxTool 抽象统一接口</text>

  <!-- Down arrows -->
  <line x1="200" y1="530" x2="200" y2="558" stroke="#555" stroke-width="1" marker-end="url(#arrowDim)"/>
  <line x1="520" y1="530" x2="520" y2="558" stroke="#555" stroke-width="1" marker-end="url(#arrowDim)"/>
  <line x1="840" y1="530" x2="840" y2="558" stroke="#555" stroke-width="1" marker-end="url(#arrowDim)"/>

  <!-- ======== Layer 5: Base ======== -->
  <text x="60" y="554" font-size="10" font-weight="700" fill="#666" letter-spacing="1.5">BASE · 基础层</text>

  <rect x="60" y="564" width="920" height="148" rx="8" fill="#0d0d0d" stroke="#222" stroke-width="1"/>

  <!-- SQLite -->
  <rect x="80" y="580" width="276" height="118" rx="6" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="218" y="604" text-anchor="middle" font-size="12" font-weight="600" fill="#aaa">SQLite (oryxos.db)</text>
  <line x1="96" y1="612" x2="340" y2="612" stroke="#1a1a1a" stroke-width="1"/>
  <text x="96" y="632" font-size="10" fill="#666">sessions</text>
  <text x="96" y="652" font-size="10" fill="#666">tool_invocations  (审计·Day One)</text>
  <text x="96" y="672" font-size="10" fill="#666">llm_calls  (审计·Day One)</text>
  <text x="96" y="692" font-size="10" fill="#666">scheduled_tasks / task_executions</text>

  <!-- Filesystem -->
  <rect x="382" y="580" width="276" height="118" rx="6" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="604" text-anchor="middle" font-size="12" font-weight="600" fill="#aaa">.oryxos/ 文件系统</text>
  <line x1="398" y1="612" x2="642" y2="612" stroke="#1a1a1a" stroke-width="1"/>
  <text x="398" y="632" font-size="10" fill="#666">agents/  (AGENT.md — 一个目录=一个Agent)</text>
  <text x="398" y="652" font-size="10" fill="#666">skills/  (全局 Skill 库)</text>
  <text x="398" y="672" font-size="10" fill="#666">memory/MEMORY.md  (长期记忆)</text>
  <text x="398" y="692" font-size="10" fill="#666">AGENTS.md / SOUL.md / USER.md</text>

  <!-- Config -->
  <rect x="684" y="580" width="276" height="118" rx="6" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <text x="822" y="604" text-anchor="middle" font-size="12" font-weight="600" fill="#aaa">配置与上下文</text>
  <line x1="700" y1="612" x2="944" y2="612" stroke="#1a1a1a" stroke-width="1"/>
  <text x="700" y="632" font-size="10" fill="#666">Profile / AgentLoader (derive)</text>
  <text x="700" y="652" font-size="10" fill="#666">ContextLoader</text>
  <text x="700" y="672" font-size="10" fill="#666">ConfigLoader (密钥管理)</text>
  <text x="700" y="692" font-size="10" fill="#666">mcp_servers.yaml</text>

  <!-- ======== Legend ======== -->
  <text x="60" y="742" font-size="10" font-weight="700" fill="#444" letter-spacing="1">LEGEND</text>

  <rect x="60" y="750" width="10" height="10" rx="2" fill="#111111" stroke="#FF6B2B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="78" y="760" font-size="10" fill="#555">Trigger</text>

  <rect x="150" y="750" width="10" height="10" rx="2" fill="#1a0e04" stroke="#FF6B2B" stroke-width="1.5"/>
  <text x="168" y="760" font-size="10" fill="#555">ReAct Engine</text>

  <rect x="280" y="750" width="10" height="10" rx="2" fill="#0d1114" stroke="#1a3a2a" stroke-width="1"/>
  <text x="298" y="760" font-size="10" fill="#555">Capability</text>

  <rect x="400" y="750" width="10" height="10" rx="2" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
  <text x="418" y="760" font-size="10" fill="#555">Base (Storage/Config)</text>

  <text x="520" y="760" text-anchor="middle" font-size="9" fill="#333">三触发源 → 同一 AgentService.process 链路 · ReActLoop 不感知触发来源 · Spring AI 只用 Provider 抽象</text>
</svg>