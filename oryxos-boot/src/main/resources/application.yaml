server:
  port: 8080

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: jdbc:sqlite:.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: com.oryxos.storage.config.SQLiteDialect
    open-in-view: false

oryxos:
  workspace: .oryxos
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
    - name: kimi
      api-key: ${KIMI_API_KEY:}
      base-url: https://api.moonshot.cn
  memory:
    backend: markdown
  sandbox:
    file:
      allowed-paths: .oryxos
    shell:
      allowed-commands: ls,cat,echo,date,python,git
    http:
      allowed-domains: "open.feishu.cn"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos
