server:
  port: 8080

spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    # 并发配置(200 并发压测实证):journal_mode=WAL 让读不阻塞写;busy_timeout 让并发写等待而非直接
    # SQLITE_BUSY 失败——默认配置下负载一高,会话写与审计写(llm_calls/tool_invocations)会丢行
    url: jdbc:sqlite:.oryxos/oryxos.db?journal_mode=WAL&busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

oryxos:
  workspace: .oryxos
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
    - name: kimi
      api-key: ${KIMI_API_KEY:}
      base-url: https://api.moonshot.cn
    # 第 27 节:独立 mock provider,无 key、不联网,按脚本驱动一次确定性的 ReAct(见 MockChatModel)
    - name: mock
  # 第 30 节:大模型生成 Agent 文件用的 provider/model(生成端点 generate-files)。
  # provider 缺省取 oryxos.providers 第一个;model 留空则生成端点返回 503(不发 model=null)。
  author:
    provider: deepseek
    model: deepseek-chat
  memory:
    # 长期记忆后端:markdown(默认,文件 MEMORY.md)| sqlite(memory_entries 表)| mem0(外部服务,
    # 需配 MEM0_BASE_URL / MEM0_USER_ID 环境变量)。换后端只改这一行,MemoryService 上层代码不动。
    backend: markdown

# 沙箱白名单(第24节 Sandbox):配置项为空 = "什么都不允许"(任何动作都拒绝),而非"不校验放行"。
# 路径为相对值时按启动时当前工作目录解析为绝对路径后再比对。
file:
  allowed_paths:
    - .oryxos
shell:
  allowed_commands:
    - ls
    - cat
    - echo
    - date
    - python
    - git
http:
  allowed_domains:
    - "open.feishu.cn"
    # 第 28 节 Demo 前置:31 节两个 Demo 需要的域名白名单
    # ① 天气源(Demo 一:查天气用 open-meteo)
    - "api.open-meteo.com"
    # ② 通知渠道域名(按实际渠道填——飞书/企业微信/钉钉)
    - "*.feishu.cn"
    # ③ 若日报靠 http_get 拉新闻,再加新闻源域名(如 newsapi.org)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos
